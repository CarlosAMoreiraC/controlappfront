      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        discountPercent:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCustomerRequest:
      type: object
      required:
        [tnsCode, legalName, customerTypeId, siteId, priceListId, active]
      properties:
        tnsCode:
          type: string
          minLength: 1
          example: C-1001
        legalName:
          type: string
          minLength: 1
          example: Panadería El Sol SAS
        customerTypeId:
          type: integer
          format: int64
          minimum: 1
          example: 1
        siteId:
          type: integer
          format: int64
          minimum: 1
          example: 1
        priceListId:
          type: integer
          format: int64
          minimum: 1
          example: 1
        discountPercent:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.01
          nullable: true
          example: 2.50
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        active:
          type: boolean
          example: true

    CustomerResponse:
      type: object
      required:
        - id
        - tnsCode
        - legalName
        - customerTypeId
        - siteId
        - priceListId
        - active
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        tnsCode:
          type: string
        legalName:
          type: string
        customerTypeId:
          type: integer
          format: int64
        siteId:
          type: integer
          format: int64
        priceListId:
          type: integer
          format: int64
        discountPercent:
          type: number
          nullable: true
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdjustInventoryRequest:
      type: object
      required: [quantity, reason]
      properties:
        quantity:
          type: number
          description: Distinto de cero. Positivo suma; negativo resta. Hasta 11 enteros y 3 decimales.
          example: -2.500
        reason:
          type: string
          minLength: 1
          example: Conteo físico

    InventoryResponse:
      type: object
      required: [warehouseId, productId, onHand, reserved, available, updatedAt]
      properties:
        warehouseId:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        onHand:
          type: number
        reserved:
          type: number
        available:
          type: number
          description: onHand − reserved; puede ser negativo
        updatedAt:
          type: string
          format: date-time

    InventoryMovementResponse:
      type: object
      required:
        - id
        - warehouseId
        - productId
        - type
        - quantity
        - resultingOnHand
        - resultingReserved
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        warehouseId:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        type:
          type: string
          enum: [tns_import, reservation, release, shipment, adjustment]
        quantity:
          type: number
        resultingOnHand:
          type: number
        resultingReserved:
          type: number
        reason:
          type: string
          nullable: true
        referenceType:
          type: string
          nullable: true
        referenceId:
          type: string
          nullable: true
        userId:
          type: integer
          format: int64
          nullable: true
        createdAt:
          type: string
          format: date-time
